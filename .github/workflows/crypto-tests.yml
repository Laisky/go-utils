name: Crypto tests

on:
  push:
    branches: [v6]
  pull_request:
    branches: [v6]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: crypto-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto-matrix:
    name: crypto (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.10', '1.27.3']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # Keep the Go 1.26 floor and qualify both patched compiler lines.
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check CSR source formatting
        run: test -z "$(gofmt -l crypto/x509.go crypto/x509_csr_signature_test.go)"
      - name: CSR signature behavior regressions
        run: go test -race -count=3 -timeout=5m -v -run 'TestNewX509CertByCSR(RejectsTampering|ValidSignatures|MalformedRequests|UnsupportedSignature)$' ./crypto
      - name: Vet crypto packages
        run: go vet ./crypto/...
      - name: Build all packages
        run: go build ./...
      - name: Crypto regression suite with race detection
        run: go test -race -count=1 -timeout=5m ./crypto/...

  crypto:
    needs: crypto-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both compiler checks
        env:
          CRYPTO_MATRIX_RESULT: ${{ needs.crypto-matrix.result }}
        run: test "$CRYPTO_MATRIX_RESULT" = success
