name: RBAC security

on:
  pull_request:
    branches: [v6]
    paths:
      - 'rbac*.go'
      - 'json/**'
      - 'log/**'
      - 'common/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/rbac-security.yml'
  push:
    branches: [v6]
    paths:
      - 'rbac*.go'
      - 'json/**'
      - 'log/**'
      - 'common/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/rbac-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check RBAC formatting
        run: test -z "$(gofmt -l rbac*.go)"
      - name: Run existing and new RBAC tests with real dependencies
        run: go test -race -count=1 -timeout=5m rbac*.go
      - name: Vet RBAC code and tests
        run: go vet rbac*.go
      - name: Fuzz restriction and persistence invariants
        env:
          GOMAXPROCS: '2'
        run: >-
          go test -run '^$' -fuzz '^FuzzRBACRestrictionMonotonicity$'
          -fuzztime=30s -parallel=2 -timeout=5m rbac*.go
