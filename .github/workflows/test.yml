name: Test

on:
  push:
    branches: [v6]
    paths-ignore:
      - "**/*.md"
      - ".scripts/*.sh"
  pull_request:
    branches: [v6]

  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tongsuo backs the SM2/SM3/X.509 integration tests in ./crypto; the tests are
  # skipped when the binary is absent, so CI installs a pinned release.
  TONGSUO_VERSION: "8.5.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      - name: Check gate failure reporting
        run: python3 -m unittest discover -s .scripts -p test_fast_ci.py -v
      - name: Formatting and essential unit tests
        run: python3 .scripts/fast_ci.py --evidence "$RUNNER_TEMP/fast-ci"
      - name: Retain discovery, native exits, and measured timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-ci-${{ github.sha }}
          path: ${{ runner.temp }}/fast-ci
          if-no-files-found: error
          retention-days: 14

  lint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          # go.mod declares the Go 1.26 floor; pin the patched CI compiler
          # so a matching older runner tool cache cannot satisfy this selector.
          go-version: '1.26.9'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run golangci-lint
        run: golangci-lint run -c .golangci.lint.yml --allow-parallel-runners ./...

      - name: Go vet (linux, windows, darwin)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Check if Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  full-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The module supports every Go 1.26 release and newer; qualify these
        # explicit patched compilers released on 2026-10-08 during dispatch.
        go: ['1.26.9', '1.27.2']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Restore Tongsuo
        id: tongsuo-cache
        uses: actions/cache@v4
        with:
          path: ~/.tongsuo
          key: tongsuo-${{ runner.os }}-${{ env.TONGSUO_VERSION }}

      - name: Build Tongsuo
        if: steps.tongsuo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$TONGSUO_VERSION" \
            https://github.com/Tongsuo-Project/Tongsuo.git "$RUNNER_TEMP/tongsuo"
          cd "$RUNNER_TEMP/tongsuo"
          ./config --prefix="$HOME/.tongsuo" --libdir="$HOME/.tongsuo/lib" \
            enable-ntls "-Wl,-rpath,$HOME/.tongsuo/lib"
          make -j"$(nproc)"
          make install_sw

      - name: Install Tongsuo
        run: |
          sudo ln -sf "$HOME/.tongsuo/bin/tongsuo" /usr/local/bin/tongsuo
          tongsuo version

      - name: Build
        run: go build -v ./...

      - name: Run tests with race detection
        run: go test -race -timeout 45m -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.go == '1.26.9' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
